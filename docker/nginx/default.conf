# nginx del contenedor `web`. TLS y cabeceras de seguridad las pone el nginx del host
# (docker/host-nginx/); aqui solo se sirven ficheros y se decide la cache.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La raiz elige idioma por Accept-Language; Cloudflare Pages hace lo mismo con _redirects.
    location = / {
        set $idioma es;
        if ($http_accept_language ~* "^en") {
            set $idioma en;
        }
        return 302 /$idioma/;
    }

    # Astro pone hash en el nombre de todo lo de /_astro/: se puede cachear un ano sin miedo.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    # Ficheros de configuracion del espejo de Cloudflare Pages: viajan en dist/ pero no son paginas.
    location ~ ^/_(headers|redirects)$ {
        return 404;
    }

    error_page 404 /404.html;
}
