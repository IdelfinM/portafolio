# Cabeceras del proxy hacia el contenedor del portafolio y de seguridad hacia el navegador.
# Se instala en /etc/nginx/snippets/portafolio-proxy.conf.
# La CSP es la misma que el <meta> de src/layouts/Base.astro (lo que usa GitHub Pages) mas
# frame-ancestors, que solo funciona como cabecera: si cambias una, cambia la otra.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 15s;

# Sitio estatico sin formularios ni scripts de terceros: la CSP puede ser 'self' en todo.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
