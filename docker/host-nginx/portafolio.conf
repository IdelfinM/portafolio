# vhost del portafolio en el nginx DEL HOST del 3020.
# Se instala en /etc/nginx/sites-available/portafolio y se enlaza en sites-enabled.
# Es un server propio: no toca el vhost de la clinica ni el include de Lab-Reserva.
#
# DOMINIO_CASA se reemplaza por el hostname real (p. ej. home.midominio.dev) al instalar;
# ver docs/DEPLOY.md. El certificado lo agrega `certbot --nginx -d DOMINIO_CASA`, que edita
# este fichero y anade el listen 443 y las rutas de letsencrypt.

upstream portafolio_web {
    server 127.0.0.1:8083;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_CASA;

    location / {
        proxy_pass http://portafolio_web;
        include snippets/portafolio-proxy.conf;
    }
}
